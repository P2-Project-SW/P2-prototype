<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="../dist/bundle.js"></script>
    <title>Map Output</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css" integrity="sha384-CfCrinSRH2IR6a4e6fy2q6ioOX7O6Mtm1L9vRvFZ1trBncWmMePhzvafv7oIcWiW" crossorigin="anonymous">

    <style>
        body {
            background: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 30px;
        }


        #map {
            margin: 20px auto;
            background: #222;
            padding: 10px;
            border-radius: 8px;
            width: max-content;
            display: grid;
            gap: 2px;
            position: relative;
        }

        .cell {
            width: 100%;
            height: 100%;
            border-radius: 3px;
        }

        .wall { background: #7e2121; }
        .path { background: #1a1a2e; }
        .start { background: #4caf50; }
        .end { background: #e91e63; }
        /* Gør dit dynamiske DDA-nøglespawn synligt på kortet */
        .key { background: #ffeb3b !important; } 

        #hud {
    position: fixed;
    top: 20px;
    right: 30px;
    display: flex;
    gap: 20px;
    font-size: 22px;
    font-weight: bold;
    color: #ffffff;
    background: rgba(0,0,0,0.5);
    padding: 10px 20px;
    border-radius: 10px;
    z-index: 100;
}

    </style>
</head>

<body>

    <h1>A-Maze-Ing</h1>

<div class="controls">
    <!-- Knapperne kalder nu changeDifficulty i main.ts, som nulstiller og spawner synkront -->
    <button type="button" class="btn btn-outline-secondary mb-3" onclick="changeDifficulty(null)">Initial Start (15x15)</button>
    <button type="button" class="btn btn-outline-secondary mb-3" onclick="changeDifficulty('EASY')">Force Easy (15x15)</button>
    <button type="button" class="btn btn-outline-secondary mb-3" onclick="changeDifficulty('FLOW')">Force Flow (25x25)</button>
    <button type="button" class="btn btn-outline-secondary mb-3" onclick="changeDifficulty('HARD')">Force Hard (35x35)</button>
</div>


    <div id="map"></div>
    <div id="hud">
    <span>🗝️ <span id="keyScore">0</span></span>
    <span>⏱️ <span id="Timer">02:00</span></span>
    </div>

    <div>
        <button type="button" class="btn_arrow_controls" onclick="movePlayer(0)"> &uarr; </button> <!--UP-->
    </div>

    <div class="controls">
        <button type="button" class="btn_arrow_controls" onclick="movePlayer(3)"> &larr; </button> <!--LEFT-->
        <button type="button" class="btn_arrow_controls" onclick="movePlayer(2)"> &rarr; </button> <!--RIGHT-->
    </div>

    <div>
        <button type="button" class="btn_arrow_controls" onclick="movePlayer(1)"> &darr; </button> <!--DOWN-->
    </div>

</body>
</html>
