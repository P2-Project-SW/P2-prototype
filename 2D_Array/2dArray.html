<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <title>Map Output</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script type="module" src="../dist/bundle.js"></script>
    <!-- Link til styles -->   
    <link rel="stylesheet" href="../MainMenu/styles.css" />
    <!-- Link til boxicons -->
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <title>Document</title>
    <style>
        
        body {
        display: block !important;
    }
        /*body {
            background: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 30px;
        }
*/

        #map {
            margin: 20px auto;
            background: #222;
            padding: 10px;
            border-radius: 8px;
            width: max-content;
            display: inline-grid;
            gap: 2px;
            position: relative;
            z-index: 101; 
        }

        .cell {
            width: 100%;
            height: 100%;
            border-radius: 3px;
        }

        .wall { background: #2d4a2d; }
        .path { background: #a07850; }
        .start { background: #4caf50; }
        .end { background: #e91e63; }
        /* Gør dit dynamiske DDA-nøglespawn synligt på kortet */
        .key { background: #ffeb3b !important; } 

        #hud {
    position: fixed;
    top: 20px;
    right: 30px;
    display: flex;
    gap: 20px;
    font-size: 22px;
    font-weight: bold;
    color: #ffffff;
    background: rgba(0,0,0,0.5);
    padding: 10px 20px;
    border-radius: 10px;
    z-index: 100;
}

    </style>
</head>

<body>
     <nav>
        <div class ="nav-bar">
            <span class ="logo"><a href="../index.html">A-MaZe-Ing</a></span>

            <div class="menu">
                <div class="logo-toggle">
                </div>
                <ul class="nav-links">
                   <li><a href="../index.html">Home</a></li>
                   <li><a href="../MainMenu/About.html">About</a></li> 
                   <li><a href="../MainMenu/Tutorial.html">Tutorial</a></li>
                </ul>
            </div>
        </div>
     </nav>

<div class="controls">
    <!-- Knapperne kalder nu changeDifficulty i main.ts, som nulstiller og spawner synkront -->
    <button type="button" class="btn btn-outline-secondary mb-3" onclick="changeDifficulty(null)">Initial Start (15x15)</button>
    <button type="button" class="btn btn-outline-secondary mb-3" onclick="changeDifficulty('EASY')">Force Easy (15x15)</button>
    <button type="button" class="btn btn-outline-secondary mb-3" onclick="changeDifficulty('FLOW')">Force Flow (25x25)</button>
    <button type="button" class="btn btn-outline-secondary mb-3" onclick="changeDifficulty('HARD')">Force Hard (35x35)</button>
</div>

    <script src="../MainMenu/MainMenu.js"></script>
    <div style="width: 100%; display: block; text-align: center; margin-top: 90px;">
    <div id="map"></div>
    <div id="hud">
    <span>🗝️ <span id="keyScore">0</span></span>
    <span>⏱️ <span id="Timer">02:00</span></span>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; margin-top: 20px;">
    <div>
        <button type="button" class="btn_arrow_controls" onclick="movePlayer(0)"> &uarr; </button>
    </div>
    <div>
        <button type="button" class="btn_arrow_controls" onclick="movePlayer(3)"> &larr; </button>
        <button type="button" class="btn_arrow_controls" onclick="movePlayer(2)"> &rarr; </button>
    </div>
    <div>
        <button type="button" class="btn_arrow_controls" onclick="movePlayer(1)"> &darr; </button>
    </div>
</div>

</body>
</html>
