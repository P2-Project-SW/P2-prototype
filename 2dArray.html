<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Map Output</title>

    <style>
        body {
            background: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 30px;
        }

        #map {
            margin: 20px auto;
            background: #222;
            padding: 10px;
            border-radius: 8px;
            width: max-content;
            display: grid;
            gap: 2px;
        }

        .cell {
            width: 100%;
            height: 100%;
            border-radius: 3px;
        }

        .wall { background: #111; }
        .path { background: #eee; }
        .start { background: #4caf50; }
        .end { background: #e91e63; }
    </style>
</head>

<body>

    <h1>A-Maze-Ing</h1>
    <div id="map"></div>

    <script src="2dArray.js"></script>
</body>
</html>
